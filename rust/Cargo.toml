[package]
name = "pandiff"
version = "0.8.0"
edition = "2021"
description = "Prose diffs for any document format supported by Pandoc (Rust port)"
license = "MIT"
default-run = "pandiff"

[[bin]]
name = "pandiff"
path = "src/bin/cli.rs"

[lib]
name = "pandiff"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
html5ever = "0.39.0"
markup5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
similar = "3.1.1"
regex = "1.12.4"
fancy-regex = "0.18.0"
once_cell = "1.21.4"
anyhow = "1.0.103"
thiserror = "2.0.18"
textwrap = { version = "0.16.2", default-features = false, features = ["unicode-width"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"
