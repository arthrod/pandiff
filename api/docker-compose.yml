version: '3.8'

services:
  pandiff-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN:-secure-token-change-me}
      - PANDIFF_CMD=pandiff
      - PORT=8000
    volumes:
      # Optional: mount a volume for temporary files if needed
      - /tmp/pandiff:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s