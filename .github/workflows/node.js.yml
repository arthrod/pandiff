# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn
    # Pin Pandoc to the version the committed test fixtures were captured
    # against. Pandoc's writers evolve between releases, so an unpinned action
    # installs a newer Pandoc whose output legitimately differs from the
    # fixtures (HTML/LaTeX/Word), failing the suite for reasons unrelated to the
    # code under test.
    - uses: nikeee/setup-pandoc@v1
      with:
        pandoc-version: 3.1.3
    - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-luatex
    - run: npm test
